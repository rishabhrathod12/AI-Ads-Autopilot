# Local development stack. Copy .env.example to .env and set POSTGRES_PASSWORD first.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: adpilot
      POSTGRES_DB: adpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adpilot -d adpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      ADS_PROVIDER: mock
      AD_EXECUTION_ENABLED: "false"
      DATABASE_URL: postgresql+asyncpg://adpilot:${POSTGRES_PASSWORD}@db:5432/adpilot
      DB_APP_ROLE: adpilot_app
      CORS_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.api.asgi:app --host 0.0.0.0 --port 8000"
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
