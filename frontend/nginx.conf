# UNVERIFIED: written without Docker/nginx available; test with `nginx -t` and a browser before use.
# __AUTH0_ORIGIN__ in the CSP is replaced at image build time (see Dockerfile) with https://<Auth0 domain>,
# or removed when sign-in is not configured. Sign-in needs it for token calls (connect-src) and
# silent renewal (frame-src).
# TLS is terminated by the reverse proxy / load balancer in front of this container (see
# docs/DEPLOYMENT.md); HSTS is therefore set there, not here.
server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers. `always` so they are also sent on errors. Keep them at server level: an
  # add_header inside a location block would replace these, not add to them.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # Scripts only from this origin. Styles allow inline because the charts set per-element style
  # attributes; tighten after testing in a browser.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __AUTH0_ORIGIN__; frame-src 'self' __AUTH0_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;  # forecasts and assistant answers can take several seconds
  }

  # Hashed build assets never change; the HTML shell must always be revalidated.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # (this location sets its own add_header, so repeat the security headers it would drop)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __AUTH0_ORIGIN__; frame-src 'self' __AUTH0_ORIGIN__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
